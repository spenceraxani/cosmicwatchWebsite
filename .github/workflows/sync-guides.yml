# Keeps the website in step with the v3X repository
# (spenceraxani/CosmicWatch-Desktop-Muon-Detector-v3X):
#
#   - guide pages, from the four PDF manuals      (scripts/sync-guides.py)
#   - Parts List and Digi-Key order lists, from
#     Purchasing_List_v3X_sa.xlsx                  (scripts/sync-bom.py)
#   - Downloads page and file links: newest firmware, Gerbers, commits
#                                                  (scripts/github-snapshot.mjs)
#
# Runs every day, on demand (Actions → Run workflow), and when the v3X
# repository sends a `v3x-updated` repository_dispatch event. When anything
# changed it commits the regenerated files; the host then redeploys the site.
name: Sync from the v3X repository

on:
  schedule:
    - cron: '17 9 * * *' # daily, 09:17 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [v3x-updated]

permissions:
  contents: write

concurrency:
  group: sync-guides
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Check out the v3X repository (PDFs and purchasing list only)
        uses: actions/checkout@v4
        with:
          repository: spenceraxani/CosmicWatch-Desktop-Muon-Detector-v3X
          path: .upstream
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.pdf
            /*.xlsx

      - name: What changed since the last sync
        id: diff
        run: |
          head=$(git -C .upstream rev-parse HEAD)
          last=$(jq -r '.commits[0].sha // ""' src/data_files/github-snapshot.json)
          echo "v3X repository: last synced $last, now $head"
          repo=0; [ "$head" != "$last" ] && repo=1
          pdfs=0
          for p64 in $(jq -r '.guides[].file | @base64' src/data_files/guides.json); do
            file=$(echo "$p64" | base64 -d)
            synced=$(jq -r --arg f "$file" '.guides[] | select(.file==$f) | .blobSha' src/data_files/guides.json)
            current=$(git -C .upstream rev-parse "HEAD:$file" 2>/dev/null || echo missing)
            echo "$file: synced $synced, current $current"
            if [ "$synced" != "$current" ]; then pdfs=1; fi
          done
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then repo=1; pdfs=1; fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "pdfs=$pdfs" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.diff.outputs.repo == '1'
        with:
          python-version: '3.12'

      - name: Regenerate the guide pages
        if: steps.diff.outputs.pdfs == '1'
        run: |
          pip install pymupdf pillow
          python scripts/sync-guides.py --repo .upstream

      - name: Regenerate the parts list
        if: steps.diff.outputs.repo == '1'
        run: python scripts/sync-bom.py .upstream

      - uses: pnpm/action-setup@v6
        if: steps.diff.outputs.repo == '1'

      - uses: actions/setup-node@v7
        if: steps.diff.outputs.repo == '1'
        with:
          node-version: 24
          cache: pnpm

      - name: Refresh the GitHub snapshot (firmware, file names, commits)
        if: steps.diff.outputs.repo == '1'
        run: node scripts/github-snapshot.mjs .upstream

      # The CI job checks formatting, so format the generated files the same
      # way before committing them (otherwise every sync commit fails CI).
      - name: Format the generated files
        if: steps.diff.outputs.repo == '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/content/docs/docs/guides src/data_files/guides.json src/data_files/bom.json src/data_files/github-snapshot.json

      - name: Commit the changes
        if: steps.diff.outputs.repo == '1'
        run: |
          git config user.name "cosmicwatch-sync"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/docs/docs/guides public/guides src/data_files/guides.json src/data_files/bom.json src/data_files/github-snapshot.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          upstream=$(git -C .upstream rev-parse --short HEAD)
          git commit -m "Sync with the v3X repository ($upstream)"
          git push
